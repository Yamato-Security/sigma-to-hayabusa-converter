name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # --no-root: the repository is a script collection, not an installable package.
        run: poetry install --no-root

      - name: Install pytest
        # pytest is the only runner that can import the hyphen-named test file; it is
        # not a project dependency, so add it to the Poetry environment just for CI.
        run: poetry run pip install pytest

      - name: Run unit tests
        run: poetry run pytest test_sigma-to-hayabusa-converter.py -v
