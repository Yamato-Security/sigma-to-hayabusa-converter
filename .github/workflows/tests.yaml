name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # --no-root: the repository is a script collection, not an installable package.
        run: poetry install --no-root

      - name: Install pytest
        # pytest is the only runner that can import the hyphen-named test file; it is
        # not a project dependency, so add it to the Poetry environment just for CI.
        run: poetry run pip install pytest

      - name: Run unit tests
        run: poetry run pytest test_sigma-to-hayabusa-converter.py -v
